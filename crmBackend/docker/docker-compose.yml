# ============================================================
# DIGITRANS-CM — Module CRM SavoirManger
# docker-compose.yml — Environnement complet
# Stack : Spring Boot + Angular + MySQL + Redis
# Auteur : Équipe CRM (Leukefack, Mboo, Gaouaffo)
# ============================================================

version: '3.9'

networks:
  crm-network:
    driver: bridge
    name: digitrans-crm-net

volumes:
  mysql-data:
    name: digitrans-mysql-data
  redis-data:
    name: digitrans-redis-data

services:

  # ── Base de données MySQL ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: digitrans-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPass2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm_db}
      MYSQL_USER: ${MYSQL_USER:-crmuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CrmPass2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootPass2026!}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Cache Redis (performance + sessions) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: digitrans-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisPass2026!}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisPass2026!}", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── Backend Spring Boot ───────────────────────────────────
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    container_name: digitrans-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-crm_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Douala
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-crmuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CrmPass2026!}
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-DigitransCrmJwtSecretKey2026VeryLongAndSecure!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass2026!}
    ports:
      - "8080:8080"
    networks:
      - crm-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Frontend Angular (Nginx) ───────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../backend/docker/Dockerfile.frontend
    container_name: digitrans-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - crm-network
    depends_on:
      backend:
        condition: service_healthy

  # ── Adminer (interface BDD pour debug) ────────────────────
  adminer:
    image: adminer:latest
    container_name: digitrans-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - crm-network
    depends_on:
      - mysql
    profiles:
      - dev   # Seulement en mode développement : docker compose --profile dev up
