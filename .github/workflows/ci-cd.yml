# ============================================================
# DIGITRANS-CM — Pipeline CI/CD
# GitHub Actions : Build → Test → Deploy AWS ECS (af-south-1)
# Cible KPI : déploiement complet ≤ 15 minutes
# Auteur : Équipe CRM — Mboo Atangana
# ============================================================

name: DIGITRANS-CRM CI/CD Pipeline

on:
  push:
    branches:
      - main        # Déploiement production
      - develop     # Déploiement staging
  pull_request:
    branches:
      - develop     # Tests seulement (pas de déploiement)

env:
  AWS_REGION: af-south-1
  ECR_BACKEND_REPO: digitrans-crm-backend
  ECR_FRONTEND_REPO: digitrans-crm-frontend
  ECS_CLUSTER: digitrans-crm-cluster
  ECS_SERVICE_BACKEND: crm-backend-service
  ECS_SERVICE_FRONTEND: crm-frontend-service

jobs:

  # ══════════════════════════════════════════════════════════
  # JOB 1 — Tests Backend Spring Boot
  # ══════════════════════════════════════════════════════════
  test-backend:
    name: Tests Backend (JUnit + Couverture)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: crm_test_db
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests avec couverture JaCoCo
        working-directory: ./backend
        run: |
          mvn clean verify \
            -Dspring.profiles.active=test \
            -Dspring.datasource.url=jdbc:mysql://localhost:3306/crm_test_db \
            -Dspring.datasource.username=testuser \
            -Dspring.datasource.password=testpass \
            -B

      - name: Vérifier couverture ≥ 80%
        working-directory: ./backend
        run: |
          COVERAGE=$(cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | grep -o '[0-9]*%' | head -1 | tr -d '%')
          echo "Couverture des tests : ${COVERAGE}%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ ÉCHEC : Couverture ${COVERAGE}% < 80% requis"
            exit 1
          fi
          echo "✅ Couverture ${COVERAGE}% ≥ 80% — OK"

      - name: Upload rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  # ══════════════════════════════════════════════════════════
  # JOB 2 — Build & Push Images Docker vers AWS ECR
  # ══════════════════════════════════════════════════════════
  build-and-push:
    name: Build Docker & Push ECR
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image Backend
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/docker/Dockerfile.backend \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest \
            ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push image Frontend
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/docker/Dockerfile.frontend \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest \
            ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ══════════════════════════════════════════════════════════
  # JOB 3 — Déploiement sur AWS ECS (af-south-1)
  # ══════════════════════════════════════════════════════════
  deploy:
    name: Deploy AWS ECS (Cape Town — af-south-1)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Déployer Backend sur ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Déployer Frontend sur ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_FRONTEND }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Attendre stabilisation des services
        run: |
          echo "⏳ Attente stabilisation backend..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Backend stable"

          echo "⏳ Attente stabilisation frontend..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_FRONTEND }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Frontend stable"

      - name: Mesurer temps de déploiement (KPI ≤ 15 min)
        run: |
          START_TIME=${{ github.event.head_commit.timestamp }}
          END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "🚀 Déploiement démarré : $START_TIME"
          echo "✅ Déploiement terminé : $END_TIME"
          echo "📊 KPI CI/CD : Vérifier que la durée totale du workflow ≤ 15 minutes"

      - name: Notification succès
        run: |
          echo "✅ DIGITRANS-CM CRM déployé avec succès sur AWS ECS af-south-1 (Cape Town)"
          echo "🌍 Région choisie pour minimiser la latence depuis Douala (~50ms vs ~200ms Europe)"
