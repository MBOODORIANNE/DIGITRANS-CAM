# ============================================================
# DIGITRANS-CM — Pipeline CI/CD CORRIGÉ
# ============================================================

name: DIGITRANS-CRM CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

env:
  AWS_REGION: af-south-1
  ECR_BACKEND_REPO: digitrans-crm-backend
  ECR_FRONTEND_REPO: digitrans-crm-frontend
  ECS_CLUSTER: digitrans-crm-cluster
  ECS_SERVICE_BACKEND: crm-backend-service
  ECS_SERVICE_FRONTEND: crm-frontend-service

jobs:

  # =========================
  # TEST BACKEND
  # =========================
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: crm_test_db
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: ./crmBackend
        run: |
          mvn clean verify \
            -Dspring.profiles.active=test \
            -Dspring.datasource.url=jdbc:mysql://localhost:3306/crm_test_db \
            -Dspring.datasource.username=testuser \
            -Dspring.datasource.password=testpass \
            -B

      - name: Upload JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: crmBackend/target/site/jacoco/

  # =========================
  # BUILD DOCKER
  # =========================
  build:
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - uses: actions/checkout@v4

      # 🔥 AJOUTE CE BLOC ICI
      - name: Debug files
        run: ls -R

      - name: Build backend image
        run: |
          docker build \
            -f crmBackend/docker/Dockerfile.backend \
            -t digitrans-backend \
            ./crmBackend

      - name: Build frontend image
        run: |
          docker build \
            -f crmFrontend/Dockerfile.frontend \
            -t digitrans-frontend \
            ./crmFrontend
  # =========================
  # DEPLOY AWS (OPTIONNEL)
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ECS Backend
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --force-new-deployment

      - name: Deploy ECS Frontend
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_FRONTEND }} \
            --force-new-deployment